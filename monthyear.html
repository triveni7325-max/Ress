<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Month</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3fb;
}

.box{
    width:320px;
    margin:80px auto;
    background:#fff;
    padding:20px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#0057c8;
}

label{
    font-size:18px;
    font-weight:bold;
}

select{
    width:100%;
    height:45px;
    margin-top:8px;
    margin-bottom:20px;
    font-size:18px;
    border-radius:10px;
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:15px;
    background:#3ea0f8;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#2b90ef;
}

</style>

</head>

<body>

<div class="box">

<h2>Select Year & Month</h2>

<label>Year</label>

<select id="year">
<option value="2026">2026</option>
<option value="2025">2025</option>
</select>

<label>Month</label>

<select id="month">
<option value="01">January</option>
<option value="02">February</option>
<option value="03">March</option>
<option value="04">April</option>
<option value="05">May</option>
<option value="06">June</option>
<option value="07">July</option>
<option value="08">August</option>
<option value="09">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>
</select>

<button onclick="openPage()">OK</button>

</div>

<script>

function openPage(){

let year=document.getElementById("year").value;
let month=document.getElementById("month").value;

window.location.href=year+month+".html";

}

</script>

</body>
</html>
