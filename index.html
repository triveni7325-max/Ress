<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Railway Employee Self Service</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3fb;
}

.header{
height:75px;
background:linear-gradient(90deg,#4da9ff,#efb38c);
display:flex;
align-items:center;
justify-content:space-around;
}

.menu{
font-size:34px;
color:#fff;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
}

.ress{
font-size:30px;
font-weight:bold;
color:#fff;
}

.cris{
font-size:22px;
font-weight:bold;
color:#3b2ba7;
}

.bell{
font-size:28px;
color:green;
}

.more{
font-size:32px;
color:white;
}

.title{
text-align:center;
margin-top:10px;
}

.title h1{
font-size:25px;
color:#222;
}

.title h2{
font-size:18px;
color:#a28a00;
}

</style>

</head>

<body>

<div class="header">

<div class="menu">☰</div>

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/en/thumb/8/83/Indian_Railways.svg/512px-Indian_Railways.svg.png">

<div class="ress">RESS</div>

<div class="cris">CRIS</div>

<div class="bell">🔔</div>

<div class="more">⋮</div>

</div>

<div class="title">

<h1>Railway Employee Self Service</h1>

<h2>Indian Railways</h2>

</div>





<style>

.card{
width:92%;
margin:18px auto;
background:#dfe9f8;
border-radius:28px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card-head{
background:#004fbd;
color:#fff;
text-align:center;
padding:15px 10px;
}

.card-head h3{
margin:0;
font-size:20px;
font-weight:bold;
}

.card-head p{
margin-top:4px;
font-size:17px;
font-weight:bold;
}

.card-body{
height:300px;
display:flex;
justify-content:center;
align-items:center;
background:#dfe9f8;
}

.card-body img{
width:180px;
opacity:.5;
}

.note{
text-align:center;
font-size:15px;
font-weight:bold;
color:#5d4c3a;
margin:12px 0 18px;
}

</style>

<div class="card">

<div class="card-head">
<h3>WELCOME TRIVENI KUMAR</h3>
<p>Employee No. 45329801445</p>
</div>

<div class="card-body">

<img src="https://cdn-icons-png.flaticon.com/512/7486/7486754.png">

</div>

</div>

<div class="note">
*ALL DATA PROVIDED HERE ARE PROVISIONAL
</div>






<style>

.grid{
width:92%;
margin:10px auto 30px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.menu-btn{
height:110px;
background:#49a8ff;
border:none;
border-radius:25px;
box-shadow:0 3px 8px rgba(0,0,0,.20);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:.2s;
}

.menu-btn:active{
transform:scale(.96);
}

.menu-btn img{
width:38px;
height:38px;
margin-bottom:8px;
}

.menu-btn p{
margin:0;
font-size:15px;
font-weight:bold;
color:#222;
text-align:center;
}

</style>

<div class="grid">

<button class="menu-btn" onclick="location.href='biodata.html'">
<img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
<p>Bio Data</p>
</button>

<button class="menu-btn" onclick="location.href='monthyear.html'">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
<p>Salary</p>
</button>

<button class="menu-btn" onclick="location.href='nps.html'">
<img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
<p>NPS</p>
</button>

<button class="menu-btn" onclick="location.href='tax.html'">
<img src="https://cdn-icons-png.flaticon.com/512/2331/2331941.png">
<p>Income Tax</p>
</button>

<button class="menu-btn" onclick="location.href='loan.html'">
<img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">
<p>Loans/<br>Advances</p>
</button>

<button class="menu-btn" onclick="location.href='leave.html'">
<img src="https://cdn-icons-png.flaticon.com/512/747/747310.png">
<p>Leave</p>
</button>

<button class="menu-btn" onclick="location.href='family.html'">
<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">
<p>Family</p>
</button>

<button class="menu-btn" onclick="location.href='retirement.html'">
<img src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">
<p>Retirement<br>Benefits</p>
</button>

</div>







<style>

/* Button Hover Animation */
.menu-btn:hover{
background:#2f96ff;
transform:translateY(-3px);
box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* Mobile Responsive */
@media(max-width:480px){

.grid{
grid-template-columns:repeat(3,1fr);
gap:12px;
padding:0 8px;
}

.menu-btn{
height:105px;
border-radius:22px;
}

.menu-btn img{
width:34px;
height:34px;
}

.menu-btn p{
font-size:13px;
line-height:16px;
}

.card{
width:95%;
}

.card-head h3{
font-size:18px;
}

.card-head p{
font-size:15px;
}

.title h1{
font-size:23px;
}

.title h2{
font-size:16px;
}

}

/* Bottom Space */
.bottom-space{
height:25px;
}

</style>

<div class="bottom-space"></div>

<script>

function openPage(page){
window.location.href=page;
}

document.querySelectorAll(".menu-btn").forEach(btn=>{

btn.addEventListener("click",function(){

this.style.transform="scale(.95)";

setTimeout(()=>{
this.style.transform="scale(1)";
},120);

});

});

</script>
</body>
</html>
